name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: |
          python3 -m unittest test_episoda.py test_ebbinghaus.py
          python3 -m unittest discover tests

      - name: Smoke test — server imports cleanly
        run: python3 -c "import server; print('server.py OK')"

      - name: Bootstrap DB via server.get_db()
        run: |
          python3 -c "
          import server
          conn = server.get_db()
          conn.close()
          print('DB bootstrapped at:', server.DB_PATH)
          "

      - name: CLI — save a memory
        run: python3 episoda.py save "CI test memory from GitHub Actions" --category ci --importance 5

      - name: CLI — search memories
        run: python3 episoda.py search "CI test"

      - name: CLI — list memories
        run: python3 episoda.py list

      - name: CLI — stats
        run: python3 episoda.py stats

      - name: Verify zero third-party dependencies
        run: |
          python3 -c "
          import ast, sys, importlib.util

          def is_stdlib(name):
              # sys.stdlib_module_names available Python 3.10+; fall back to util check
              if hasattr(sys, 'stdlib_module_names'):
                  return name in sys.stdlib_module_names
              spec = importlib.util.find_spec(name)
              if spec is None:
                  return False
              loc = getattr(spec, 'origin', '') or ''
              return 'site-packages' not in loc

          third_party = set()
          for fname in ('server.py', 'episoda.py'):
              with open(fname) as f:
                  tree = ast.parse(f.read())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          top = alias.name.split('.')[0]
                          if top and not is_stdlib(top) and top not in ('server', 'episoda'):
                              third_party.add(top)
                  elif isinstance(node, ast.ImportFrom):
                      # 'from datetime import timezone' -> module=datetime (stdlib)
                      if node.module:
                          top = node.module.split('.')[0]
                          if top and not is_stdlib(top) and top not in ('server', 'episoda'):
                              third_party.add(top)

          if third_party:
              print('FAIL: third-party imports found:', third_party)
              sys.exit(1)
          print('PASS: zero third-party dependencies confirmed')
          "
