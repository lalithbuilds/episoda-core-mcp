name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in episoda-mcp"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting an issue with episoda-mcp!"
  - type: dropdown
    id: client
    attributes:
      label: MCP Client
      options:
        - Claude Code (CLI)
        - Claude Desktop
        - Cursor IDE
        - Windsurf Editor
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: "1. Run episoda save..."
    validations:
      required: true
